# meow-openwrt: static meow for OpenWrt routers, 4 archs x 3 profiles, as
# raw binaries plus .ipk (opkg) and .apk (apk-tools 3) packages.
#
# Push to `main` builds and keeps the files as workflow artifacts.
# A tag `owrt-vX.Y.Z-N` also publishes them as a GitHub release.
name: openwrt

on:
  push:
    branches: [main]
    tags: ["owrt-v*"]
    paths-ignore: ["**.md", "docs/**", "website/**", "openwrt-fork/research/**"]
  workflow_dispatch:

concurrency:
  group: openwrt-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.arch }} ${{ matrix.profile }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        arch: [aarch64, armv7, armv7-a9, armv7-sf, mipsel, mips]
        profile: [tiny, lightweight, full]
    steps:
      - uses: actions/checkout@v5

      # clang/libclang (bindgen), cmake and zstd come with the ubuntu-24.04
      # image; apt-get here hung for 10+ minutes on some runners.
      - name: Host tools
        run: clang --version | head -1 && cmake --version | head -1 && zstd --version

      - name: Rust 1.96.0 with rust-src
        run: |
          rustup toolchain install 1.96.0 --profile minimal --component rust-src
          rustc +1.96.0 -V

      # The SDK toolchain (only staging_dir/toolchain-* and host/lib are
      # unpacked), keyed by the SDK sha256 build.sh pins for this arch, so
      # other edits to build.sh keep the cache.
      - name: SDK key
        id: sdk
        run: |
          sha=$(grep -A1 -E "^[[:space:]]*${{ matrix.arch }}\)" openwrt-fork/ci/build.sh | grep -o 'SDK_SHA=[0-9a-f]*' | cut -d= -f2)
          [ -n "$sha" ] && echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Cache OpenWrt toolchain
        uses: actions/cache@v5
        with:
          path: ~/.cache/meow-owrt-tc
          key: owrt-tc-${{ matrix.arch }}-${{ steps.sdk.outputs.sha }}

      # Registry, git deps and the target dir (BoringSSL's cmake build and
      # build-std's std are the slow parts; the final LTO link always reruns).
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: owrt-${{ matrix.arch }}-${{ matrix.profile }}
          workspaces: ". -> target/owrt-${{ matrix.arch }}"
          cache-all-crates: true
          cache-on-failure: true

      - name: Build
        run: bash openwrt-fork/ci/build.sh ${{ matrix.arch }} ${{ matrix.profile }}

      - name: apk-tools
        run: |
          bash openwrt/install-apk-tools.sh "$HOME/apk-tools"
          echo "APK=$HOME/apk-tools/apk" >> "$GITHUB_ENV"

      - name: Package
        run: |
          case "$GITHUB_REF" in
            refs/tags/owrt-v*) v=${GITHUB_REF#refs/tags/owrt-v} ;;
            *) v=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)_git${GITHUB_RUN_NUMBER}-0 ;;
          esac
          case "${{ matrix.arch }}" in
            aarch64) labels="aarch64_generic aarch64_cortex-a53 aarch64_cortex-a72 aarch64_cortex-a76" ;;
            # Cortex-A15 runs the A7 build (same ARMv7VE + NEON-VFPv4 ISA).
            armv7) labels="arm_cortex-a7_neon-vfpv4 arm_cortex-a15_neon-vfpv4" ;;
            armv7-a9) labels="arm_cortex-a9_vfpv3-d16 arm_cortex-a9_neon" ;;
            armv7-sf) labels="arm_cortex-a9" ;;
            mipsel) labels="mipsel_24kc" ;;
            mips) labels="mips_24kc" ;;
          esac
          bin=dist/meow-${{ matrix.profile }}-${{ matrix.arch }}
          for l in $labels; do
            bash openwrt-fork/ci/package.sh "$bin" ${{ matrix.profile }} "$l" "$v" dist
          done
          ls -la dist

      - uses: actions/upload-artifact@v5
        with:
          name: meow-${{ matrix.profile }}-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/owrt-v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: openwrt-fork/release-notes
      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The changelog is openwrt-fork/release-notes/<tag>.md when it
          # exists; GitHub's commit list is the fallback.
          notes=openwrt-fork/release-notes/$GITHUB_REF_NAME.md
          if [ -f "$notes" ]; then set -- --notes-file "$notes"; else set -- --generate-notes; fi
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" \
            --title "meow-openwrt ${GITHUB_REF_NAME#owrt-v}" "$@"
